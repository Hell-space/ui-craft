<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>细水 · 记账首页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* 页面外 */
  --desk:#E6E2D9;
  --desk-ink:#8A8478;
  /* App 内 */
  --paper:#F7F5F0;
  --card:#FFFFFF;
  --ink:#1E1D1A;
  --ink-2:#4A4741;
  --muted:#8C877D;
  --faint:#BDB8AD;
  --line:#E9E5DC;
  --line-2:#F0EDE6;
  --accent:#2E6A4E;      /* 墨绿：主操作、收入、“还在节奏内” */
  --accent-soft:#E3EEE7;
  --warn:#B4532F;        /* 赭石：超出节奏 */
  --warn-soft:#F6E7DF;

  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"Inter","SF Pro Text",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(120% 80% at 50% 40%, #EEEBE4 0%, var(--desk) 60%, #DEDACF 100%);
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:48px 16px;
}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-0.01em}

/* ---------- 画框外 ---------- */
.stage{display:flex;align-items:center;gap:72px}
.colophon{width:200px;color:var(--desk-ink);font-size:12px;line-height:1.8}
.colophon .mark{font-family:var(--serif);font-size:28px;color:var(--ink);letter-spacing:0.08em;line-height:1.2;margin-bottom:10px}
.colophon p+p{margin-top:12px}
.colophon .rule{width:24px;height:1px;background:var(--faint);margin:18px 0}
.colophon dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.colophon dt{color:var(--faint)}
@media (max-width:760px){.colophon{display:none}.stage{gap:0}}

/* ---------- 机身 ---------- */
.device{
  width:390px;height:844px;flex:none;position:relative;
  border-radius:56px;
  background:var(--paper);
  box-shadow:
    0 0 0 10px #1B1A18,
    0 0 0 11px #3A3833,
    0 2px 2px 11px rgba(0,0,0,.06),
    0 30px 60px -10px rgba(40,34,24,.35),
    0 60px 120px -40px rgba(40,34,24,.30);
  overflow:hidden;
}
@media (max-width:430px){
  body{padding:24px 0}
  .device{transform:scale(calc((100vw - 32px) / 412px));transform-origin:top center}
}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#0E0E0D;z-index:30}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 34px 0 46px;font-family:var(--num);font-weight:600;font-size:16px;
  background:linear-gradient(var(--paper) 70%, rgba(247,245,240,0));
}
.statusbar .icons{display:flex;gap:6px;align-items:center}

.screen{position:absolute;inset:0;overflow-y:auto;padding:54px 0 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ---------- 顶部 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
.month-btn{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500;color:var(--ink-2);background:none;border:0;font-family:inherit;padding:6px 8px 6px 0;border-radius:8px;cursor:pointer}
.month-btn:hover{color:var(--ink)}
.top-actions{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--line-2)}
.icon-btn:active{background:var(--line)}

/* ---------- 主数字 ---------- */
.hero{padding:18px 20px 4px}
.hero-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hero-amount{margin-top:6px;display:flex;align-items:baseline;gap:4px;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);letter-spacing:-0.035em}
.hero-amount .cur{font-size:22px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-right:2px;transform:translateY(-1px)}
.hero-amount .int{font-size:48px;line-height:1}
.hero-amount .dec{font-size:24px;color:var(--muted);letter-spacing:-0.01em}
.hero-sub{margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.6}
.hero-sub b{font-weight:500;color:var(--ink)}

/* 预算进度条 + 时间刻度 */
.budget-bar{margin:18px 20px 0}
.track{position:relative;height:8px;border-radius:4px;background:var(--line)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.track .over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--warn) 0 2px,#D98E70 2px 4px);border-radius:0 4px 4px 0}
.track .pace{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--paper);}
.track .pace::after{content:"";position:absolute;left:0;right:0;top:3px;bottom:3px;background:var(--ink-2);border-radius:1px}
.bar-legend{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}
.bar-legend .num{color:var(--ink-2)}

/* 提示条 */
.note{margin:16px 20px 0;padding:11px 14px;border-radius:12px;background:var(--warn-soft);color:#7A3519;font-size:13px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}

/* ---------- 通用区块 ---------- */
.section{margin-top:28px;padding:0 20px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-head h2{font-size:15px;font-weight:600;letter-spacing:0.01em}
.sec-head a{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:2px}
.sec-head a:hover{color:var(--ink)}
.card{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(60,50,30,.04)}

/* ---------- 日支出图 ---------- */
.chart-card{padding:16px 16px 12px}
.chart-read{display:flex;justify-content:space-between;align-items:baseline;min-height:22px}
.chart-read .d{font-size:12px;color:var(--muted)}
.chart-read .v{font-size:15px;font-weight:500}
.chart{position:relative;height:104px;margin-top:10px}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(30,1fr);gap:3px;align-items:end}
.bar{position:relative;height:100%;display:flex;align-items:flex-end;cursor:pointer;background:none;border:0;padding:0}
.bar i{display:block;width:100%;border-radius:2px 2px 1px 1px;background:#CFCAC0;transition:background .15s}
.bar.over i{background:var(--warn);opacity:.78}
.bar.today i{background:var(--ink)}
.bar.future i{height:3px!important;background:var(--line);border-radius:2px}
.bar:hover i,.bar.sel i{background:var(--ink-2);opacity:1}
.bar.today.sel i{background:var(--ink)}
.bar.future{cursor:default}
.bar.future:hover i{background:var(--line)}
.guide{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);pointer-events:none}
.guide span{position:absolute;right:0;top:-17px;font-size:10px;color:var(--muted);background:var(--card);padding-left:4px;font-family:var(--num)}
.axis{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:6px;font-size:10px;color:var(--faint);font-family:var(--num)}
.axis span{text-align:center;white-space:nowrap}

/* ---------- 分类预算 ---------- */
.cats{padding:4px 16px}
.cat{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0}
.cat+.cat{border-top:1px solid var(--line-2)}
.glyph{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--line-2);color:var(--ink-2)}
.cat-main{min-width:0}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.cat-top .amt{font-size:14px;font-weight:500}
.cat-top .of{color:var(--faint);font-size:12px;margin-left:2px}
.mini{position:relative;height:4px;border-radius:2px;background:var(--line-2);margin-top:8px}
.mini .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink-2)}
.mini.warn .fill{background:var(--warn)}
.mini .pace{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--faint)}
.cat-pct{font-size:12px;color:var(--muted);width:34px;text-align:right}
.cat-pct.warn{color:var(--warn);font-weight:500}

/* ---------- 流水 ---------- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);padding:0 4px 8px}
.day-head + .card{margin-bottom:18px}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;transition:background .12s}
.tx:first-child{border-radius:18px 18px 0 0}
.tx:last-child{border-radius:0 0 18px 18px}
.tx:only-child{border-radius:18px}
.tx+.tx{box-shadow:inset 0 1px 0 var(--line-2)}
.tx:hover{background:#FBFAF7}
.tx:active{background:var(--line-2)}
.tx-t{font-size:14.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-m{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.tx-a{font-size:15px;font-weight:500;text-align:right}
.tx-a.in{color:var(--accent)}

/* ---------- 底栏 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:88px;z-index:20;
  display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:start;padding:8px 12px 0;
  background:rgba(247,245,240,.86);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  box-shadow:inset 0 1px 0 var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);background:none;border:0;font-family:inherit;padding:4px 0;cursor:pointer}
.tab.on{color:var(--ink);font-weight:500}
.tab:hover{color:var(--ink-2)}
.add{
  justify-self:center;width:56px;height:56px;border-radius:50%;border:0;margin-top:-14px;
  background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 0 0 5px var(--paper),0 8px 18px -6px rgba(46,106,78,.6);
  transition:transform .18s cubic-bezier(.3,.7,.4,1.4),box-shadow .18s;
}
.add:hover{transform:translateY(-1px)}
.add:active{transform:scale(.94)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:25}

/* 隐藏金额 */
.masked [data-m]{color:transparent!important;position:relative}
.masked [data-m]::after{content:"＊＊＊＊";position:absolute;right:0;bottom:0;color:var(--faint);letter-spacing:0.05em;font-size:inherit}
.masked .hero-amount .int,.masked .hero-amount .dec{filter:blur(10px);transition:filter .2s}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){
  .bar i{transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 18ms)}
  @keyframes grow{from{transform:scaleY(0)}}
}
</style>
</head>

<script>
(function(){
  /* ------- 数据：2026 年 11 月，今天 10 日 ------- */
  const daily=[312.50,168.00,96.80,145.30,523.00,88.40,214.60,402.90,286.20,148.70];
  const TODAY=10, DAYS=30, DAILY_BUDGET=6500/30;
  const WEEK=["日","一","二","三","四","五","六"];
  const wd=d=>WEEK[new Date(2026,10,d).getDay()];
  const fmt=n=>"¥"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

  /* ------- 每日柱状图 ------- */
  const MAX=560;
  const bars=document.getElementById("bars"), axis=document.getElementById("axis");
  const readD=document.getElementById("readD"), readV=document.getElementById("readV");
  document.getElementById("guide").style.bottom=(DAILY_BUDGET/MAX*100)+"%";
  for(let d=1;d<=DAYS;d++){
    const b=document.createElement("button");
    b.className="bar"; b.style.setProperty("--i",d);
    const i=document.createElement("i");
    if(d<=TODAY){
      const v=daily[d-1];
      i.style.height=Math.max(3,v/MAX*100)+"%";
      if(d===TODAY) b.classList.add("today","sel");
      else if(v>DAILY_BUDGET) b.classList.add("over");
      b.setAttribute("aria-label",`11月${d}日 支出 ${v.toFixed(2)} 元`);
      b.addEventListener("click",()=>select(d,b));
      b.addEventListener("mouseenter",()=>preview(d));
      b.addEventListener("mouseleave",restore);
    }else{
      b.classList.add("future"); b.tabIndex=-1; b.setAttribute("aria-hidden","true");
    }
    b.appendChild(i); bars.appendChild(b);
    const s=document.createElement("span");
    s.textContent=(d===1||d%5===0)?d:""; if(d===TODAY){s.style.color="var(--ink)";s.style.fontWeight="600"}
    axis.appendChild(s);
  }
  let selDay=TODAY;
  function label(d){return (d===TODAY?"今天 · ":"")+`11月${d}日 周${wd(d)}`}
  function preview(d){readD.textContent=label(d);readV.textContent=fmt(daily[d-1])}
  function restore(){preview(selDay)}
  function select(d,b){selDay=d;bars.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");preview(d)}

  /* ------- 图标 ------- */
  const P={
    food:'<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M9 3v5"/><path d="M17 21V3c-2 1-3 3.5-3 7 0 1.7 1.3 3 3 3"/>',
    shop:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
    move:'<rect x="5" y="4" width="14" height="13" rx="3"/><path d="M5 11h14M8.5 17l-1.5 3M15.5 17l1.5 3"/><circle cx="8.5" cy="14" r=".6" fill="currentColor"/><circle cx="15.5" cy="14" r=".6" fill="currentColor"/>',
    home:'<path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
    fun:'<rect x="3.5" y="6" width="17" height="12" rx="3"/><path d="M8 10v4M6 12h4"/><circle cx="15.5" cy="11" r=".8" fill="currentColor"/><circle cx="17" cy="13.5" r=".8" fill="currentColor"/>',
    coffee:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3.5c-.6.8-.6 1.7 0 2.5M12 3.5c-.6.8-.6 1.7 0 2.5"/>',
    salary:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/>'
  };
  const ico=(k,c)=>`<span class="glyph" ${c?`style="background:${c[0]};color:${c[1]}"`:""}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg></span>`;

  /* ------- 分类预算（按超前程度排序） ------- */
  const pace=TODAY/DAYS;
  const cats=[
    ["购物","shop",712.00,1000],
    ["餐饮","food",1126.40,2200],
    ["交通","move",198.60,500],
    ["娱乐","fun",135.40,800],
    ["居家","home",214.00,2000],
  ];
  document.getElementById("cats").innerHTML=cats.map(([n,k,s,b])=>{
    const r=s/b, warn=r>pace+0.15, pct=Math.round(r*100);
    return `<div class="cat">${ico(k)}<div class="cat-main">
      <div class="cat-top"><span>${n}</span><span><span class="amt num" data-m>${fmt(s)}</span><span class="of num"> / ${b.toLocaleString()}</span></span></div>
      <div class="mini ${warn?"warn":""}"><div class="fill" style="width:${Math.min(100,r*100)}%"></div><div class="pace" style="left:${pace*100}%"></div></div>
    </div><span class="cat-pct num ${warn?"warn":""}">${pct}%</span></div>`;
  }).join("");

  /* ------- 最近账目 ------- */
  const days=[
    {d:"今天",sub:"11月10日 周二",items:[
      ["coffee","瑞幸咖啡","生椰拿铁 · 08:42 · 微信",-15.90],
      ["move","地铁","2 号线 静安寺 → 张江高科 · 08:15",-4.00],
      ["food","午饭","黄焖鸡米饭 · 12:20 · 支付宝",-28.80],
      ["food","盒马鲜生","晚饭食材 · 18:56 · 招行信用卡",-100.00],
    ]},
    {d:"昨天",sub:"11月9日 周一",items:[
      ["shop","优衣库","摇粒绒外套 · 20:11",-199.00],
      ["food","美团外卖","和府捞面 · 12:05",-42.50],
      ["move","滴滴出行","加班回家 · 22:47",-23.70],
      ["food","全家便利店","早餐 · 08:31",-21.00],
    ]},
    {d:"11月5日",sub:"周四",items:[
      ["salary","工资","十月薪资 · 招商银行",18500.00],
    ]},
  ];
  const tint={coffee:null,move:null,food:null,shop:null,salary:["var(--accent-soft)","var(--accent)"]};
  const ledger=document.getElementById("ledger");
  days.forEach(g=>{
    const out=g.items.filter(x=>x[3]<0).reduce((a,x)=>a-x[3],0);
    const h=document.createElement("div"); h.className="day-head";
    h.innerHTML=`<span><span style="color:var(--ink-2);font-weight:500">${g.d}</span>　${g.sub}</span>`+
      (out?`<span>支出 <span class="num" data-m>${fmt(out)}</span></span>`:"");
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=g.items.map(([k,t,m,a])=>`<div class="tx" tabindex="0">${ico(k,tint[k])}
      <div style="min-width:0"><div class="tx-t">${t}</div><div class="tx-m">${m}</div></div>
      <div class="tx-a num ${a>0?"in":""}" data-m>${a>0?"+":"−"}${fmt(Math.abs(a)).slice(1)}</div></div>`).join("");
    ledger.append(h,c);
  });
  const end=document.createElement("p");
  end.style.cssText="text-align:center;font-size:12px;color:var(--faint);padding:8px 0 4px";
  end.textContent="本月已记 37 笔";
  ledger.appendChild(end);

  /* ------- 隐藏金额 ------- */
  const eye=document.getElementById("eye"), dev=document.querySelector(".device");
  eye.addEventListener("click",()=>{
    const on=dev.classList.toggle("masked");
    eye.setAttribute("aria-pressed",on);
    eye.setAttribute("aria-label",on?"显示金额":"隐藏金额");
    document.getElementById("eyeOpen").style.display=on?"none":"";
    document.getElementById("eyeShut").style.display=on?"":"none";
  });
})();
</script>
</body>
</html>
