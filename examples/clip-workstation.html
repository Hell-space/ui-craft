<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>天亮以前，菜场醒了 · 声序</title>
<style>
:root{--paper:#f5f6f1;--surface:#fdfefa;--ink:#172b24;--muted:#57675d;--line:#d6dcd2;--accent:#256847;--focus:#0757aa;--mono:"IBM Plex Mono",Consolas,"SFMono-Regular",monospace;--sans:"Instrument Sans","Segoe UI","Microsoft YaHei UI","PingFang SC","Microsoft YaHei",sans-serif;--grid:44px 31px minmax(0,1fr) 82px 70px 94px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:active:not(:disabled){filter:brightness(.92)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.shell{max-width:1190px;padding-inline:clamp(18px,4.3vw,58px);margin:auto}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top-inner{height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand,.brand-name,.tools,.eyebrow,.clock,.timeline-head,.title-block,.table-head,.row-actions,.count,.key-btn,.save{display:flex;align-items:center}
.brand{gap:16px;min-width:0}
.brand-name{gap:9px;font-size:21px;font-weight:700;letter-spacing:.055em;white-space:nowrap}
.logo{display:inline-flex;align-items:center;justify-content:center;gap:2.5px;width:31px;height:31px;background:#254a36;border-radius:7px;transform:rotate(-4deg)}
.logo b{width:2.5px;background:#d7eca7;border-radius:2px}
.logo b:nth-child(1){height:9px}.logo b:nth-child(2){height:17px}.logo b:nth-child(3){height:12px}.logo b:nth-child(4){height:7px}
.app-name{border-left:1px solid var(--line);padding-left:16px;color:var(--muted);font-size:13px;white-space:nowrap}
.tools{gap:18px}
.save{gap:7px;color:var(--muted);font-size:12px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:#33805c}
.save[data-ok="false"]::before{background:#ad7526}
.key-btn{gap:7px;color:#3f5146;padding:5px 8px;min-height:38px;border-radius:5px;font-size:13px}
.key-btn:hover,.key-btn:focus-visible{background:#eaf0e6}
.key-icon{width:18px;height:13px;border:1.4px solid currentColor;border-radius:3px;position:relative}
.key-icon:before{content:"";position:absolute;inset:2px 2px 4px;background:radial-gradient(circle,currentColor .8px,transparent 1.1px) 0 0/4px 3px}
.key-icon:after{content:"";position:absolute;bottom:1.5px;left:4px;right:4px;height:1.4px;background:currentColor}
main{padding-block:clamp(24px,4vh,43px) 36px}
.eyebrow{gap:10px;font-size:13px;color:#526456;font-weight:600;line-height:1.5}
.eyebrow .sep{width:18px;height:1px;background:#a5b4a5}
.eyebrow .ep{font:12px var(--mono);letter-spacing:.02em}
h1,h2,h3,p{margin:0}
h1{margin:8px 0 23px;font-size:clamp(27px,3vw,40px);font-weight:670;letter-spacing:-.045em;line-height:1.3}
.timeline{border-radius:12px;background:#203a32;padding:20px 24px 22px;color:#f0f5e9}
.timeline-head{justify-content:space-between;gap:8px;margin-bottom:17px}
.title-block{gap:12px}.title-block h2{font-size:16px;font-weight:600;letter-spacing:.025em}
.play{display:grid;place-items:center;width:42px;height:42px;background:#d3e7aa;border-radius:50%;color:#203b2f;flex:none}
.play:hover{background:#e2efc5}.play:focus-visible,.segment:focus-visible,.seek:focus-visible{outline:2px solid white;outline-offset:2px}
.play i{display:block;width:0;height:0;border-block:6px solid transparent;border-left:9px solid currentColor;margin-left:2px}
.play[data-playing="true"] i{width:10px;height:13px;border:0;border-inline:3px solid currentColor;margin:0}
.clock{align-items:baseline;gap:7px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
#elapsed{font-size:22px;line-height:1;font-weight:500;letter-spacing:-.06em}
.total{font-size:13px;color:#c1cfbc}
.ruler{height:26px;position:relative;color:#bfccbf}
.marks{position:absolute;inset:0 0 2px}
.tick{position:absolute;top:0;bottom:0;min-width:1px}
.tick:before{content:"";position:absolute;bottom:0;width:1px;height:4px;background:#809681}
.tick span{display:block;position:absolute;font:10px var(--mono);white-space:nowrap;transform:translateX(-50%)}
.tick.first span{transform:none}.tick.last span{transform:translateX(-100%)}
.seek{width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:crosshair;appearance:none;background:transparent;z-index:1;border-radius:2px}
.seek::-webkit-slider-thumb{appearance:none;width:1px;height:22px;background:transparent}
.seek::-moz-range-thumb{border:0;width:1px;height:22px;background:transparent}
.track-wrap{position:relative}
.track{display:flex;gap:0;height:77px}
.segment{min-width:0;position:relative;flex:1 1 0;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px 8px;border-radius:4px;background:var(--clip);color:#233c33;box-shadow:inset 0 0 0 1.5px #203a32}
.segment[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px #203a32,inset 0 0 0 3px #f6ffe8}
.segment-name{display:flex;align-items:center;gap:6px;width:100%;min-width:0;line-height:1.2;font-size:11px;font-weight:650;white-space:nowrap}
.seg-index{font:10px var(--mono);letter-spacing:-.02em}.seg-label{overflow:hidden;text-overflow:ellipsis}
.wave{width:100%;height:38px;display:block}
.needle{position:absolute;pointer-events:none;left:0;top:-3px;bottom:-3px;width:1px;background:#f8f9ec;box-shadow:0 0 0 1px #14382c99;z-index:2}
.needle:before{content:"";position:absolute;top:-1px;left:-3px;border-top:5px solid #f8f9ec;border-inline:3.5px solid transparent}
.table-head{justify-content:space-between;gap:8px;margin:24px 0 11px}
.count{gap:10px}.count h2{font-size:21px;line-height:1.35;font-weight:650;letter-spacing:-.04em}.count span{color:var(--muted);font:12px var(--sans)}
.undo,.close{height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #b8c5b8;background:var(--surface);border-radius:6px;font-size:13px;font-weight:550}
.undo:hover:not(:disabled),.close:hover{background:#e8efe6}.undo:disabled{color:#738075;border-color:#d3d9ce;background:#eef1e9}
.undo-icon{position:relative;width:15px;height:15px;display:inline-block}
.undo-icon:before{content:"";position:absolute;top:4px;left:1px;border-left:1.6px solid currentColor;border-bottom:1.6px solid currentColor;width:5px;height:5px;transform:rotate(45deg)}
.undo-icon:after{content:"";position:absolute;top:6px;left:1px;width:11px;height:5px;border:1.6px solid currentColor;border-bottom:0;border-left:0;border-top-right-radius:5px}
.table{background:var(--surface);border:1px solid #ccd5c9;border-radius:9px;overflow:clip}
.cols,.clip-row{display:grid;grid-template-columns:var(--grid);gap:10px;align-items:center;padding:0 13px}
.cols{height:34px;background:#eef1e9;border-bottom:1px solid var(--line);font-size:11px;color:#56675b}
.cols .position{grid-column:1/3;text-align:center}.cols .numeric{text-align:right}.cols .movement{text-align:center}
.clip-list{padding:0;margin:0;list-style:none;display:flex;flex-direction:column}
.clip-row{position:relative;min-height:67px;isolation:isolate;background:var(--surface);border-bottom:1px solid #e2e7de}
.clip-list>.clip-row:last-child{border-bottom-color:transparent}
.clip-row[data-selected="true"]{background:#edf4e6;box-shadow:inset 3px 0 #367b4f}
.clip-row[data-pending="true"] .grip{color:#143f29;background:#d5e4ce}
.clip-row.is-slot{background:#e1ebd8;box-shadow:inset 0 0 0 1px #8aab83}
.clip-row.is-slot>*{visibility:hidden}
.clip-row.ghost{position:fixed;z-index:10;pointer-events:none;padding:0 13px;min-height:0;opacity:.96;background:#eff6e8;border:1px solid #739474;border-radius:6px;box-shadow:0 8px 20px #18362326}
.grip{height:44px;width:44px;display:grid;place-items:center;border-radius:5px;touch-action:none;cursor:grab;user-select:none;color:#859085}
.grip:hover{background:#e5ebe1;color:#435b48}.grip:active{cursor:grabbing}
.grip i{display:block;width:10px;height:16px;background:radial-gradient(circle,currentColor 1.3px,transparent 1.6px) 0 0/5px 5px}
.ordinal,.time{font:14px var(--mono);font-variant-numeric:tabular-nums}
.ordinal{color:#6a796c;font-size:13px}
.select{display:flex;align-items:center;gap:12px;min-width:0;align-self:stretch;padding:3px 0;text-align:left;border-radius:4px}
.select:focus-visible{outline-offset:0}
.swatch{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--clip);color:#334e42}
.mini{width:22px;height:17px}
.copy{min-width:0;display:block}
.clip-title{display:block;font-size:15px;font-weight:630;line-height:1.55;color:#20372a}
.excerpt,.mobile-meta{display:block;color:var(--muted);font-size:12px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-meta{display:none}
.time{text-align:right;color:#506456;font-size:13px}.duration{color:#263e2d}
.row-actions{justify-content:flex-end;gap:2px}
.move{width:44px;height:44px;display:grid;place-items:center;border-radius:5px;color:#48654c}
.move:hover:not(:disabled){background:#d9e6d5}
.move:disabled{color:#aeb9ad}
.arrow{width:15px;height:15px;display:block;position:relative}
.arrow:before{content:"";position:absolute;left:7px;top:2px;width:1.6px;height:11px;border-radius:1px;background:currentColor}
.arrow:after{content:"";position:absolute;left:4px;top:2px;width:7px;height:7px;border-top:1.6px solid;border-left:1.6px solid;transform:rotate(45deg)}
.down .arrow{transform:rotate(180deg)}
.status{min-height:1.5em;margin-top:7px;font-size:12px;color:#53695a}
dialog{max-width:min(370px,calc(100% - 32px));width:100%;padding:21px;border:1px solid #b8c7b9;border-radius:10px;color:var(--ink);background:var(--surface);box-shadow:0 16px 60px #16372325}
dialog::backdrop{background:#15271f66}
dialog h2{font-size:21px;margin:0 0 12px}
dialog dl{margin:0 0 17px}
dialog dl div{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:37px;border-bottom:1px solid var(--line)}
dialog dt{font-size:13px}dialog dd{margin:0;white-space:nowrap}
kbd{font:12px var(--mono);padding:2px 5px;border-radius:4px;background:#eef1e9;border:1px solid #d4ddcf;box-shadow:0 1px #c6d2c2}
.close{width:100%;height:40px}
@media(max-width:790px){:root{--grid:44px 22px minmax(0,1fr) 60px 58px 90px}.cols,.clip-row{gap:6px;padding-inline:8px}.clip-row.ghost{padding-inline:8px}.timeline{padding:17px 18px 20px}.select{gap:9px}}
@media(max-width:610px){:root{--grid:44px 21px minmax(0,1fr) 90px}.shell{padding-inline:16px}.top-inner{height:54px}.brand{gap:10px}.app-name{padding-left:10px;font-size:12px}.tools{gap:7px}.save{display:none}.key-btn{min-height:44px}.eyebrow{font-size:12px}main{padding-block:24px 26px}h1{margin:7px 0 16px}.timeline{border-radius:9px;padding:14px 13px 15px}.timeline-head{margin-bottom:12px}.title-block{gap:9px}.title-block h2{font-size:15px}.play{height:44px;width:44px}#elapsed{font-size:20px}.track{height:62px}.segment{padding:6px 5px}.seg-label{display:none}.seg-index{font-size:10px}.wave{height:31px}.table-head{margin:18px 0 8px}.count h2{font-size:19px}.undo{min-height:44px}.cols,.clip-row{gap:3px;padding-inline:4px}.clip-row.ghost{padding-inline:4px}.cols{height:30px}.clip-row{min-height:62px}.start,.duration,.cols .numeric,.excerpt{display:none}.mobile-meta{display:block}.time{font-size:12px}.swatch{width:4px;height:29px;border-radius:2px}.mini{display:none}.select{gap:7px}.clip-title{font-size:15px;overflow-wrap:anywhere}.ordinal{font-size:12px}.cols .position{text-align:left;padding-left:8px}.row-actions{gap:0}.move{width:44px}.close{height:44px}}
@media(max-width:345px){.shell{padding-inline:10px}.app-name{display:none}.timeline-head{gap:3px}.title-block{gap:6px}.total{font-size:11px}:root{--grid:44px 18px minmax(0,1fr) 88px}}
@media(hover:hover){.clip-row:not([data-selected="true"]):not(.ghost):not(.is-slot):hover{background:#f3f5ef}}
@media(pointer:coarse){.key-btn,.undo{min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
@media(forced-colors:active){.clip-row[data-selected="true"],.segment[aria-pressed="true"]{outline:2px solid Highlight;outline-offset:-2px}.grip i{forced-color-adjust:none}.play i{color:ButtonText}.needle{background:Highlight}.wave,.mini{forced-color-adjust:none}.swatch,.segment{forced-color-adjust:none}}
</style>

'use strict';

const find = selector => document.querySelector(selector);
const ids = items.map(clip => clip.id);
const clipsById = new Map(items.map(clip => [clip.id, clip]));
const totalTime = items.reduce((sum, clip) => sum + clip.duration, 0);
const key = 'shengxu.city-sounds.014.v1';
const list = find('#clips');
const track = find('#track');
const play = find('#play');
const seek = find('#seek');
const undoButton = find('#undo');
const help = find('#shortcuts');
const status = find('#status');
const rows = new Map();
const segments = new Map();
const audio = new Map();

function validOrder(value) {
  return Array.isArray(value) && value.length === ids.length &&
    new Set(value).size === ids.length && value.every(id => clipsById.has(id));
}

let saved = {};
try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch {}
let order = validOrder(saved.order) ? saved.order : ids.slice();
let selected = clipsById.has(saved.selected) ? saved.selected : order[0];
let history = Array.isArray(saved.history) ? saved.history.filter(validOrder).slice(-60) : [];
let cue = selected;
let playing = false;
let audioTicket = 0;
let playFrame = 0;
let drag = null;
const retiredPresses = new Map();

function persist() {
  let ok = true;
  try { localStorage.setItem(key, JSON.stringify({order, selected, history})); }
  catch { ok = false; }
  const output = find('#save');
  output.dataset.ok = String(ok);
  output.textContent = ok ? '已存本机' : '仅本次会话';
}

function timecode(seconds) {
  const t = Math.floor(Math.max(0, seconds) + 0.000001);
  return [Math.floor(t / 60), t % 60].map(n => String(n).padStart(2, '0')).join(':');
}

function startTime(id) {
  let result = 0;
  for (const item of order) {
    if (item === id) break;
    result += clipsById.get(item).duration;
  }
  return result;
}

function signal(message) { status.textContent = message; }

function drawWave(canvas, peaks) {
  const box = canvas.getBoundingClientRect();
  if (box.width < 1 || box.height < 1) return;
  const ratio = Math.min(3, devicePixelRatio || 1);
  canvas.width = Math.round(box.width * ratio);
  canvas.height = Math.round(box.height * ratio);
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  const n = Math.max(1, Math.floor(box.width / 3));
  const pitch = box.width / n;
  ctx.fillStyle = '#2a473b';
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * peaks.length / n);
    const b = Math.ceil((i + 1) * peaks.length / n);
    const peak = Math.max(...peaks.slice(a, b));
    const height = Math.max(1.2, peak / 100 * (box.height - 2));
    ctx.fillRect(i * pitch + 0.4, (box.height - height) / 2, Math.max(1, pitch - 1.3), height);
  }
}

function paintWaves() {
  for (const clip of items) {
    drawWave(segments.get(clip.id).querySelector('.wave'), clip.peaks);
    drawWave(rows.get(clip.id).querySelector('.mini'), clip.peaks);
  }
}

function buildClip(clip) {
  const row = document.createElement('li');
  row.className = 'clip-row';
  row.dataset.id = clip.id;
  row.style.setProperty('--clip', clip.color);
  row.innerHTML = '<span class="grip" aria-hidden="true" title="拖动排序"><i></i></span>' +
    '<span class="ordinal" aria-hidden="true"></span>' +
    '<button type="button" class="select"><span class="swatch" aria-hidden="true"><canvas class="mini"></canvas></span>' +
    '<span class="copy"><span class="clip-title"></span><span class="excerpt"></span><span class="mobile-meta"></span></span></button>' +
    '<span class="time start"></span><span class="time duration"></span>' +
    '<span class="row-actions"><button class="move up" type="button" data-dir="-1"><i class="arrow" aria-hidden="true"></i></button>' +
    '<button class="move down" type="button" data-dir="1"><i class="arrow" aria-hidden="true"></i></button></span>';
  row.querySelector('.select').setAttribute('aria-label', '选择' + clip.name);
  row.querySelector('.clip-title').textContent = clip.name;
  row.querySelector('.excerpt').textContent = clip.text;
  row.querySelector('.mobile-meta').textContent = clip.role + ' · ' + timecode(clip.duration);
  row.querySelector('.duration').textContent = timecode(clip.duration);
  for (const [part, text] of [['.up', '上移'], ['.down', '下移']]) {
    const button = row.querySelector(part);
    button.setAttribute('aria-label', text + clip.name);
    button.title = text + clip.name;
  }
  rows.set(clip.id, row);

  const segment = document.createElement('button');
  segment.type = 'button';
  segment.className = 'segment';
  segment.dataset.id = clip.id;
  segment.style.setProperty('--clip', clip.color);
  segment.style.flex = '0 0 ' + (100 * clip.duration / totalTime) + '%';
  segment.innerHTML = '<span class="segment-name"><span class="seg-index"></span><span class="seg-label"></span></span>' +
    '<canvas class="wave" aria-hidden="true"></canvas>';
  segment.querySelector('.seg-label').textContent = clip.name;
  segment.setAttribute('aria-label', '定位到' + clip.name);
  segment.title = clip.name;
  segments.set(clip.id, segment);

  const player = new Audio();
  player.preload = 'metadata';
  player.src = 'data:audio/ogg;codecs=opus;base64,' + clip.audio;
  player.addEventListener('ended', () => {
    if (!playing || cue !== clip.id) return;
    const next = order[order.indexOf(cue) + 1];
    if (next) setCue(next, 0, true);
    else { playing = false; drawTransport(); }
  });
  player.addEventListener('loadedmetadata', () => { if (cue === clip.id) syncClock(); });
  audio.set(clip.id, player);
}

function setOrderInDom(parent, map) {
  order.forEach((id, index) => {
    const node = map.get(id);
    if (parent.children[index] !== node) parent.insertBefore(node, parent.children[index] || null);
  });
}

function updateList() {
  setOrderInDom(list, rows);
  setOrderInDom(track, segments);
  let offset = 0;
  order.forEach((id, index) => {
    const on = id === selected;
    const row = rows.get(id);
    const segment = segments.get(id);
    const ordinal = String(index + 1).padStart(2, '0');
    row.dataset.selected = String(on);
    row.querySelector('.ordinal').textContent = ordinal;
    row.querySelector('.select').setAttribute('aria-pressed', String(on));
    row.querySelector('.select').tabIndex = on ? 0 : -1;
    row.querySelector('.start').textContent = timecode(offset);
    row.querySelector('.start').setAttribute('aria-label', '入点 ' + timecode(offset));
    row.querySelector('.duration').setAttribute('aria-label', '时长 ' + timecode(clipsById.get(id).duration));
    row.querySelector('.up').disabled = index === 0;
    row.querySelector('.down').disabled = index === order.length - 1;
    for (const button of row.querySelectorAll('.move')) button.tabIndex = on ? 0 : -1;
    segment.querySelector('.seg-index').textContent = ordinal;
    segment.setAttribute('aria-pressed', String(on));
    segment.tabIndex = on ? 0 : -1;
    offset += clipsById.get(id).duration;
  });
  undoButton.disabled = history.length === 0;
  syncClock();
}

function syncClock() {
  const current = audio.get(cue);
  if (!current) return;
  const within = Math.min(current.currentTime || 0, clipsById.get(cue).duration);
  const elapsed = Math.min(totalTime, startTime(cue) + within);
  const shown = timecode(elapsed);
  if (find('#elapsed').textContent !== shown) find('#elapsed').textContent = shown;
  seek.value = String(elapsed);
  seek.setAttribute('aria-valuetext', shown + '，共 ' + timecode(totalTime));
  find('#needle').style.left = (elapsed * 100 / totalTime) + '%';
}

function drawTransport() {
  play.dataset.playing = String(playing);
  const label = playing ? '暂停播放' : '播放节目';
  play.title = label;
  play.setAttribute('aria-label', label);
  cancelAnimationFrame(playFrame);
  const frame = () => {
    syncClock();
    if (playing) playFrame = requestAnimationFrame(frame);
  };
  frame();
}

function setCue(id, offset, run) {
  const ticket = ++audioTicket;
  const old = audio.get(cue);
  if (old) old.pause();
  cue = id;
  const current = audio.get(cue);
  const position = Math.max(0, Math.min(clipsById.get(id).duration, offset));
  current.currentTime = position;
  playing = run;
  drawTransport();
  if (run) {
    current.play().catch(() => {
      if (ticket !== audioTicket) return;
      playing = false;
      drawTransport();
      signal('未能播放这条旁白，请再次按播放。');
    });
  }
}

function togglePlay(fromSelected = false) {
  if (fromSelected && selected !== cue) { setCue(selected, 0, true); return; }
  const current = audio.get(cue);
  if (playing) {
    ++audioTicket;
    playing = false;
    current.pause();
    drawTransport();
  } else if (current.ended || current.currentTime >= clipsById.get(cue).duration - 0.03) {
    setCue(fromSelected ? selected : order[0], 0, true);
  } else setCue(cue, current.currentTime, true);
}

function choose(id, locate = false) {
  const changed = selected !== id;
  selected = id;
  if (locate || (changed && !playing)) setCue(id, 0, playing);
  if (changed) { updateList(); persist(); }
}

function focusRow(id, part = '.select', reveal = false) {
  const row = rows.get(id);
  let control = row.querySelector(part);
  if (!control || control.disabled) control = row.querySelector('.select');
  control.focus({preventScroll:true});
  if (reveal) row.scrollIntoView({block:'nearest', inline:'nearest'});
}

function commit(next, id, part, reveal) {
  if (next.every((value, index) => value === order[index])) return false;
  history.push(order.slice());
  if (history.length > 60) history.shift();
  order = next;
  updateList();
  persist();
  focusRow(id, part, reveal);
  signal('已将“' + clipsById.get(id).name + '”移至第 ' + (order.indexOf(id) + 1) + ' 位。');
  return true;
}

function move(id, delta, part, reveal = false) {
  choose(id);
  const from = order.indexOf(id);
  const to = from + delta;
  if (to < 0 || to >= order.length) return;
  const next = order.slice();
  next.splice(from, 1);
  next.splice(to, 0, id);
  commit(next, id, part, reveal);
}

function undoMove() {
  if (!history.length) return;
  order = history.pop();
  updateList();
  persist();
  focusRow(selected);
  signal('已撤销上一次移动。');
}

function drawRuler() {
  const step = Math.max(5, Math.round(totalTime / 4 / 5) * 5);
  const times = [0];
  for (let t = step; t < totalTime - step * 0.45; t += step) times.push(t);
  times.push(totalTime);
  const marks = find('#marks');
  for (const [index, t] of times.entries()) {
    const mark = document.createElement('span');
    mark.className = 'tick ' + (index === 0 ? 'first' : index === times.length - 1 ? 'last' : '');
    mark.style.left = (100 * t / totalTime) + '%';
    const label = document.createElement('span');
    label.textContent = timecode(t);
    mark.append(label);
    marks.append(mark);
  }
}

// The real list keeps its committed DOM order during a drag. Flex order previews slots.
function positionGhost() {
  if (!drag || !drag.ghost) return;
  const g = drag;
  g.ghost.style.transform = 'translateY(' + (g.y - g.grabY) + 'px)';
  const others = order.filter(id => id !== g.id);
  let index = 0;
  for (const id of others) {
    const box = rows.get(id).getBoundingClientRect();
    if (g.y >= box.top + box.height / 2) index++;
  }
  const preview = others.slice();
  preview.splice(index, 0, g.id);
  if (!g.preview || preview.some((id, i) => id !== g.preview[i])) {
    g.preview = preview;
    preview.forEach((id, i) => { rows.get(id).style.order = String(i); });
  }
}

function autoScroll(now) {
  if (!drag || !drag.ghost) return;
  const edge = Math.min(64, innerHeight / 5);
  const elapsed = Math.min(125, Math.max(1, now - drag.scrollAt));
  drag.scrollAt = now;
  let speed = 0;
  if (drag.y < edge) speed = -Math.min(16, (edge - drag.y) / 4);
  if (drag.y > innerHeight - edge) speed = Math.min(16, (drag.y - innerHeight + edge) / 4);
  if (speed) {
    const before = scrollY;
    window.scrollBy(0, speed * elapsed / (1000 / 60));
    if (before !== scrollY) positionGhost();
  }
  drag.frame = requestAnimationFrame(autoScroll);
}

function startPreview(g) {
  const row = rows.get(g.id);
  const box = row.getBoundingClientRect();
  const ghost = row.cloneNode(true);
  ghost.classList.add('ghost');
  ghost.inert = true;
  ghost.setAttribute('aria-hidden', 'true');
  ghost.style.width = box.width + 'px';
  ghost.style.height = box.height + 'px';
  ghost.style.left = box.left + 'px';
  ghost.style.top = '0';
  row.classList.add('is-slot');
  document.body.append(ghost);
  g.ghost = ghost;
  g.scrollAt = performance.now();
  drawWave(ghost.querySelector('.mini'), clipsById.get(g.id).peaks);
  positionGhost();
  g.frame = requestAnimationFrame(autoScroll);
}

function cleanupDrag(cancelled = true) {
  if (!drag) return null;
  const g = drag;
  drag = null;
  if (cancelled) retiredPresses.set(g.kind, g.pointer);
  cancelAnimationFrame(g.frame);
  if (g.ghost) g.ghost.remove();
  const row = rows.get(g.id);
  delete row.dataset.pending;
  row.classList.remove('is-slot');
  for (const item of rows.values()) item.style.removeProperty('order');
  if (list.hasPointerCapture(g.pointer)) list.releasePointerCapture(g.pointer);
  return g;
}

document.addEventListener('pointerdown', event => {
  if (event.isPrimary) retiredPresses.delete(event.pointerType);
}, true);

document.addEventListener('click', event => {
  if (event.pointerType && retiredPresses.get(event.pointerType) === event.pointerId) {
    retiredPresses.delete(event.pointerType);
    event.preventDefault();
    event.stopImmediatePropagation();
    return;
  }
  if (!drag) return;
  // A completed native action from another device supersedes an unfinished drag.
  // Ignore extra contacts of the active device instead of treating them as moves.
  if (event.detail === 0 || (event.pointerType && event.pointerType !== drag.kind)) cleanupDrag();
  else { event.preventDefault(); event.stopImmediatePropagation(); }
}, true);

list.addEventListener('pointerdown', event => {
  const handle = event.target.closest('.grip');
  if (!handle || !event.isPrimary || event.button !== 0) return;
  if (drag && drag.kind === event.pointerType) return;
  if (drag) cleanupDrag();
  event.preventDefault();
  const row = handle.closest('.clip-row');
  const id = row.dataset.id;
  choose(id);
  focusRow(id);
  drag = {id, pointer:event.pointerId, kind:event.pointerType, startX:event.clientX, startY:event.clientY, y:event.clientY,
          viewportWidth:innerWidth, viewportHeight:innerHeight,
          grabY:event.clientY - row.getBoundingClientRect().top,
          threshold:event.pointerType === 'touch' ? 8 : 5, preview:null, ghost:null, frame:0};
  row.dataset.pending = 'true';
  list.setPointerCapture(event.pointerId);
});

function sameDragViewport() {
  return drag.viewportWidth === innerWidth && drag.viewportHeight === innerHeight;
}

function ownsLiveDrag(event) {
  if (!drag || event.pointerId !== drag.pointer) return false;
  if (sameDragViewport()) return true;
  cleanupDrag();
  return false;
}

list.addEventListener('pointermove', event => {
  if (!ownsLiveDrag(event)) return;
  drag.y = event.clientY;
  if (!drag.ghost && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) >= drag.threshold) {
    startPreview(drag);
  } else positionGhost();
});

list.addEventListener('pointerup', event => {
  if (!ownsLiveDrag(event)) return;
  drag.y = event.clientY;
  positionGhost();
  const g = cleanupDrag(false);
  if (g.preview) commit(g.preview, g.id, '.select', false);
});

list.addEventListener('pointercancel', event => { if (drag && event.pointerId === drag.pointer) cleanupDrag(); });
list.addEventListener('lostpointercapture', event => {
  if (event.target === list && drag && event.pointerId === drag.pointer) cleanupDrag();
});
window.addEventListener('blur', cleanupDrag);
window.addEventListener('resize', () => { if (drag && !sameDragViewport()) cleanupDrag(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) cleanupDrag(); });
window.addEventListener('pagehide', cleanupDrag);

list.addEventListener('click', event => {
  const row = event.target.closest('.clip-row');
  if (!row || event.target.closest('.grip')) return;
  const button = event.target.closest('.move');
  if (button) {
    const down = Number(button.dataset.dir) > 0;
    move(row.dataset.id, down ? 1 : -1, down ? '.down' : '.up');
  } else {
    choose(row.dataset.id);
    focusRow(selected);
  }
});

track.addEventListener('click', event => {
  const segment = event.target.closest('.segment');
  if (segment) choose(segment.dataset.id, true);
});

seek.addEventListener('input', () => {
  if (drag) cleanupDrag();
  const target = Number(seek.value);
  let start = 0;
  for (const id of order) {
    const end = start + clipsById.get(id).duration;
    if (target < end || id === order[order.length - 1]) { setCue(id, target - start, playing); break; }
    start = end;
  }
});

play.addEventListener('click', () => togglePlay());
undoButton.addEventListener('click', undoMove);
find('#help').addEventListener('click', () => { cleanupDrag(); help.showModal(); });
find('#close-help').addEventListener('click', () => help.close());
help.addEventListener('close', () => find('#help').focus({preventScroll:true}));

document.addEventListener('keydown', event => {
  if (event.isComposing || help.open || event.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  if (event.key === 'Escape' && drag) {
    event.preventDefault();
    cleanupDrag();
    signal('已取消拖动。');
    return;
  }
  if (drag && event.key === 'Tab') cleanupDrag();
  if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 'z') {
    event.preventDefault();
    if (!event.repeat) { cleanupDrag(); undoMove(); }
    return;
  }
  const onClip = !!event.target.closest('.clip-row,.segment');
  if (event.ctrlKey || event.metaKey || event.shiftKey) return;
  const delta = event.key === 'ArrowUp' ? -1 : event.key === 'ArrowDown' ? 1 : 0;
  if (delta && (onClip || event.altKey || event.target === document.body)) {
    event.preventDefault();
    cleanupDrag();
    if (event.altKey) move(selected, delta, '.select', true);
    else {
      const index = Math.max(0, Math.min(order.length - 1, order.indexOf(selected) + delta));
      choose(order[index]);
      focusRow(selected, '.select', true);
    }
  } else if (event.code === 'Space' && !event.altKey &&
             (event.target.closest('.select,.segment') || event.target === document.body)) {
    event.preventDefault();
    if (!event.repeat) { cleanupDrag(); togglePlay(true); }
  }
});

items.forEach(buildClip);
find('#count').textContent = items.length + ' 段';
find('#total').textContent = timecode(totalTime);
seek.max = String(totalTime);
if (/Mac|iPhone|iPad/.test(navigator.platform)) find('#mod-key').textContent = '⌘';
drawRuler();
updateList();
drawTransport();
persist();
new ResizeObserver(paintWaves).observe(track);
requestAnimationFrame(paintWaves);

</script>
</body>
</html>
